name: Balanced Sleep Emulator Check
on:
  push:
    branches: ['codex/balanced-sleep-apk']
    paths: ['.github/workflows/balanced-sleep-smoke.yml', '.github/scripts/balanced_sleep_smoke.py']
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BalancedSleep-APK
          path: ci-apk
          run-id: 41495253208
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch, and test alarm with screen off
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: python3 .github/scripts/balanced_sleep_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Emulator-smoke-results
          path: smoke-results
          if-no-files-found: ignore
