name: Balanced Sleep APK
on:
  push:
    branches: ['codex/balanced-sleep-apk']
    paths: ['android-sleep/**', '.github/workflows/balanced-sleep-apk.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-sleep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and Android lint
        run: gradle --no-daemon testDebugUnitTest lintDebug
      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify signing and package
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > apk-info.txt
          cp "$APK" BalancedSleep-0.1.0.apk
          sha256sum BalancedSleep-0.1.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BalancedSleep-APK
          path: |
            android-sleep/BalancedSleep-0.1.0.apk
            android-sleep/SHA256SUMS.txt
            android-sleep/apk-info.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-and-lint-reports
          path: |
            android-sleep/app/build/reports
            android-sleep/app/build/test-results
          if-no-files-found: ignore
