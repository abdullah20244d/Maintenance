{% extends 'base/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto p-8 bg-white rounded-3xl shadow-xl border border-slate-200 text-right">
    <h2 class="text-xl font-bold mb-4">متابعة حالة بلاغ الصيانة</h2>
    <form class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">رقم Ticket *</label>
            <input type="text" placeholder="مثال: IT-2026-000101" class="w-full p-2.5 rounded-xl border border-slate-300 text-xs">
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">الرقم الوظيفي *</label>
            <input type="text" placeholder="مثال: 001045" class="w-full p-2.5 rounded-xl border border-slate-300 text-xs">
        </div>
        <button type="submit" class="w-full py-3 bg-blue-600 text-white rounded-xl text-xs font-bold">الكشف عن حالة البلاغ</button>
    </form>
</div>
{% endblock %}
