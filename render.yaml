databases:
  - name: it-ticket-db
    plan: free
    region: singapore

services:
  - type: web
    name: it-ticket-system
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: it-ticket-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        value: ""
      - key: APP_URL
        value: ""
    healthCheckPath: /api/public/config
