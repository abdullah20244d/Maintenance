services:
  - type: web
    name: it-ticket-system
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        value: ""
      - key: APP_URL
        value: ""
    disk:
      name: tickets-data
      mountPath: /opt/render/project/data
      sizeGB: 1
    healthCheckPath: /api/public/config
